name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve a running production cutover; the host independently rejects stale SHAs.
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.repository == 'syscoin/sysnode-info' && github.ref == 'refs/heads/master') }}

permissions:
  contents: read

jobs:
  test:
    name: Jest + build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines is ">=20 <24"; cover both active LTS
        # lines so a bump in either doesn't silently break CI.
        node: ['20', '22']

    env:
      CI: 'true'
      # react-scripts build wraps any warning as an error under CI=true
      # on its own, but some consumers of this action read DISABLE_ESLINT_PLUGIN.
      # We intentionally keep lint errors failing the build.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # `npm ci` is strict about package-lock.json: it fails if the
        # lock and package.json drift, and never mutates node_modules.
        # Exactly what CI wants.
        run: npm ci

      - name: Run tests
        # test:ci in package.json already forces --watchAll=false
        # and caps workers; don't reinvent that flag set here.
        run: npm run test:ci

      - name: Verify production dependency behavior
        run: npm run test:production-runtime

      - name: Verify deployment request boundary
        run: npm run test:deployment

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        # Smoke-test that the bundle still compiles on this Node
        # version — covers things that unit tests won't catch
        # (e.g. ESM/CJS interop regressions in new deps).
        run: npm run build

      - name: Install browser for recovery-alert layout checks
        if: matrix.node == '22'
        run: npx playwright install --with-deps chromium

      - name: Check recovery-alert browser flow and small windows
        if: matrix.node == '22'
        run: npm run test:recovery-browser

      - name: Preserve recovery-alert screenshots and failure traces
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: recovery-alert-browser
          path: test-results/sentry/
          if-no-files-found: ignore

  deploy:
    name: Deploy production
    needs: [test]
    if: github.event_name == 'push' && github.repository == 'syscoin/sysnode-info' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Request exact-commit deployment
        run: node scripts/request-deploy.cjs frontend
        env:
          SYSNODE_DEPLOY_HOST: ${{ secrets.SYSNODE_DEPLOY_HOST }}
          SYSNODE_DEPLOY_USER: ${{ vars.SYSNODE_DEPLOY_USER }}
          SYSNODE_DEPLOY_KEY: ${{ secrets.SYSNODE_DEPLOY_KEY }}
          SYSNODE_KNOWN_HOSTS: ${{ secrets.SYSNODE_KNOWN_HOSTS }}
